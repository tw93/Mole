version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    reviewers:
      - "tw93"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # v32 installs no Nix on Intel macOS ("no binary distribution of Nix
      # for your platform"), which the macos-15-intel Package job needs.
      - dependency-name: "cachix/install-nix-action"
        versions: [">= 32"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    reviewers:
      - "tw93"
    open-pull-requests-limit: 10
