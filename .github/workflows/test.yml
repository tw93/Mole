name: Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  core-tests:
    name: Shell, Go & Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Install tools
        run: brew install bats-core shellcheck coreutils parallel

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Run test script
        env:
          ROOMY_SKIP_API_TESTS: "1"
          ROOMY_PERF_BYTES_TO_HUMAN_LIMIT_MS: "6000"
          ROOMY_PERF_GET_FILE_SIZE_LIMIT_MS: "3000"
          ROOMY_TEST_JOBS: "6"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: ./scripts/test.sh

  release-preflight:
    name: Release Hygiene Preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Run release hygiene checks
        run: scripts/release-preflight.sh

      - name: Validate Brewfile toolchain
        run: brew bundle check --file=Brewfile || brew bundle install --file=Brewfile

  api-contracts:
    name: API Contract Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run API contract tests
        run: npm run test:api

  native-swift:
    name: Native Swift Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Run native Swift tests
        run: swift test --package-path macos/RoomyUI

  ui-ux:
    name: Native UI UX Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run native UI UX tests
        run: npm run test:ux

  native-app-build:
    name: Native App Build Smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Build native macOS app
        env:
          SIGN_IDENTITY: "-"
        run: scripts/build-app.sh

      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict .build/RoomyUI.app

  native-dmg-build:
    name: Native DMG Build Smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Build unsigned DMG
        env:
          SKIP_SIGN: "1"
          DMGMAKER_REF: v1.0.3
        run: scripts/build-dmg.sh

      - name: Upload unsigned DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Roomy-unsigned-dmg
          path: |
            .build/Roomy.dmg
            .build/Roomy.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: macOS
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Install bats
        run: brew install bats-core coreutils

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Smoke load on ${{ matrix.os }}
        run: |
          echo "Testing on ${{ matrix.os }}..."
          bash -n roomy
          source lib/core/common.sh
          echo "✓ Successfully loaded on ${{ matrix.os }}"

      - name: Run core bats subset
        env:
          ROOMY_TEST_NO_AUTH: "1"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          bats tests/core_safe_functions.bats \
               tests/core_common.bats \
               tests/core_timeout.bats \
               tests/regression.bats \
               tests/cli.bats

  security:
    name: Security Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Install tools
        run: brew install bats-core coreutils

      - name: Check for unsafe rm usage
        run: |
          echo "Checking for unsafe rm patterns..."
          # Filters in order:
          #   safe_remove / validate_path: known safe wrapper helpers in file_ops.sh
          #   # SAFE: explicit annotation that a direct rm is gated by narrow checks
          #   ^path:line:[ws]#: pure comment lines that mention rm -rf in docs
          #   echo : help text or messages that print rm -rf as documentation
          if grep -rn "rm -rf" --include="*.sh" lib/ | grep -v -E "safe_remove|validate_path|# SAFE|^[^:]+:[0-9]+:[[:space:]]*#|echo "; then
            echo "✗ Unsafe rm -rf usage found (annotate gated calls with '# SAFE: <reason>' or route through safe_remove)"
            exit 1
          fi
          echo "✓ No unsafe rm usage found"

      - name: Verify app protection
        run: |
          echo "Verifying critical file protection..."
          bash -c '
          source lib/core/common.sh
          if should_protect_from_uninstall "com.apple.Safari"; then
            echo "✓ Safari is protected"
          else
            echo "✗ Safari protection failed"
            exit 1
          fi
          '

      - name: Check for secrets
        run: |
          echo "Checking for hardcoded secrets..."
          matches=$(grep -r "password\|secret\|api_key" --include="*.sh" . \
            | grep -v "# \|test" \
            | grep -v -E "lib/core/sudo\.sh|lib/core/app_protection\.sh|lib/clean/user\.sh|lib/clean/brew\.sh|bin/optimize\.sh|lib/clean/apps\.sh|lib/uninstall/batch\.sh" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "✗ Potential secrets found"
            exit 1
          fi
          echo "✓ No secrets found"

      - name: Run high-risk path regression tests
        env:
          ROOMY_TEST_NO_AUTH: "1"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bats tests/core_safe_functions.bats tests/purge.bats tests/installer.bats
