name: Secrets

# Kept out of Validation so its path filters never skip it: a token pasted
# into a Markdown file is still a leaked token. No paths filter by design.
# Before a V*-linux tag, this run must be green on the commit being tagged
# (AGENTS.md Releases).
on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled: on push gitleaks scans only that push's commits, so a
# cancelled run would leave them unscanned for good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
