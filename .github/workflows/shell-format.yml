name: Shell Formatting

on:
  push:
  pull_request:

jobs:
  shfmt:
    name: Format shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Check shell formatting
        run: |
          set -euo pipefail
          shfmt -i 4 -ci -sr -d .
