name: Shell Format Check

on:
  push:
  pull_request:

jobs:
  shfmt:
    name: Run shfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Check shell formatting
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' ! -path './tests/tmp-*' -print0 \
            | xargs -0 -r shfmt -d -i 4 -ci -sr
