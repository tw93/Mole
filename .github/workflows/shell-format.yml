name: Shell Formatter

on:
  push:
  pull_request:

jobs:
  shfmt:
    name: Format shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Format shell files
        run: |
          set -euo pipefail
          find . -type f \( -name '*.sh' -o -name 'mole' \) \
            ! -path './.git/*' ! -path './tests/tmp-*' -print0 |
            xargs -0 -r shfmt -w -i 4 -ci -sr

      - name: Commit formatted files
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply shfmt"
          commit_user_name: mole-bot
          commit_user_email: actions@github.com

      - name: Ensure formatting is clean
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
