name: Shell Format & Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - mole
  pull_request:
    paths:
      - '**/*.sh'
      - mole

jobs:
  format-lint:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shfmt and shellcheck
        run: brew install shfmt shellcheck

      - name: Run shfmt in diff mode
        run: |
          set -euo pipefail
          search_cmd=(find . -type f \( -name '*.sh' -o -name 'mole' \) \
                            ! -path './.git/*' ! -path './tests/tmp-*')
          first_file="$(${search_cmd[@]} -print -quit)"
          if [[ -z "$first_file" ]]; then
            echo "No shell files found; skipping shfmt"
            exit 0
          fi
          "${search_cmd[@]}" -exec shfmt -i 4 -ci -sr -d {} +

      - name: Run shellcheck
        run: |
          set -euo pipefail
          search_cmd=(find . -type f \( -name '*.sh' -o -name 'mole' \) \
                            ! -path './.git/*' ! -path './tests/tmp-*')
          first_file="$(${search_cmd[@]} -print -quit)"
          if [[ -z "$first_file" ]]; then
            echo "No shell files found; skipping shellcheck"
            exit 0
          fi
          "${search_cmd[@]}" -exec shellcheck --rcfile .shellcheckrc {} +
